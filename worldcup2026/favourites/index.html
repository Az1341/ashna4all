<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favourite Teams — World Cup 2026 | GoalCurrent.live</title>
<meta name="description" content="Save your favourite World Cup 2026 teams and follow their journey. All 48 officially qualified nations.">
<link rel="canonical" href="https://goalcurrent.live/worldcup2026/favourites/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X84HCE5KGT"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-X84HCE5KGT');</script>
<link rel="stylesheet" href="/css/style.css">
<style>
.fav-page{max-width:700px;margin:0 auto;padding:16px 14px 120px}
.fav-hero{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-top:4px solid var(--gold);border-radius:var(--r-lg);padding:20px 16px;margin-bottom:16px;box-shadow:var(--glass-shadow);text-align:center}
.fav-hero h1{font-size:clamp(18px,4vw,22px);font-weight:700;color:var(--t1);margin-bottom:6px}
.fav-hero p{font-size:12px;color:var(--t2);line-height:1.6}
.fav-hero-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.fav-hero-meta span{font-size:11px;font-weight:700;color:var(--t2);background:rgba(37,99,235,.07);border:1px solid var(--glass-border);padding:4px 10px;border-radius:999px}
.fav-search{position:relative;margin-bottom:12px}
.fav-search input{width:100%;padding:13px 14px 13px 42px;border-radius:var(--r-md);border:1.5px solid var(--glass-border);background:rgba(255,255,255,.85);font-size:14px;outline:none;font-family:Verdana,sans-serif;color:var(--t1);box-shadow:var(--glass-shadow);transition:border-color .2s}
.fav-search input:focus{border-color:var(--blue)}
.fav-search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px}
.conf-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.conf-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;border:1.5px solid var(--glass-border);background:rgba(255,255,255,.72);color:var(--t2);cursor:pointer;font-family:Verdana,sans-serif;transition:all .2s}
.conf-btn:hover{border-color:var(--blue);color:var(--blue)}
.conf-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.fav-section-hdr{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t4)}
.fav-section-hdr::after{content:'';flex:1;height:1px;background:rgba(37,99,235,.15)}
.fav-empty{background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:28px 16px;margin-bottom:16px;box-shadow:var(--glass-shadow);text-align:center}
.fav-empty-icon{font-size:40px;margin-bottom:10px}
.fav-empty-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:6px}
.fav-empty-sub{font-size:12px;color:var(--t3);line-height:1.6}
.my-fav-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.my-fav-item{background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-left:4px solid var(--gold);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--glass-shadow);display:flex;align-items:center;gap:12px}
.my-fav-flag{font-size:26px}
.my-fav-info{flex:1}
.my-fav-name{font-size:14px;font-weight:700;color:var(--t1)}
.my-fav-sub{font-size:11px;color:var(--t3)}
.my-fav-remove{background:none;border:1px solid rgba(220,38,38,.2);color:#dc2626;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:Verdana,sans-serif;transition:background .2s;white-space:nowrap}
.my-fav-remove:hover{background:#fee2e2}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.team-card{background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px 10px;box-shadow:var(--glass-shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.team-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(100,160,220,.2)}
.team-card.is-fav{border-color:var(--gold);border-width:2px;background:rgba(255,255,255,.9)}
.team-flag{font-size:30px;line-height:1}
.team-code{font-size:11px;font-weight:800;color:var(--blue)}
.team-name{font-size:10px;font-weight:600;color:var(--t2);line-height:1.3}
.team-conf-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(37,99,235,.08);color:var(--blue);border:1px solid rgba(37,99,235,.15)}
.fav-star{position:absolute;top:6px;right:7px;font-size:14px;opacity:.2;transition:opacity .2s,transform .2s}
.team-card.is-fav .fav-star{opacity:1;transform:scale(1.15)}
@media(max-width:480px){.fav-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>
</head>
<body>
<div id="gc-sidebar-root"></div>
<div class="gc-main-wrapper">
  <div id="gc-header-root"></div>
  <div class="gc-main-content">
    <div class="fav-page">

      <div class="fav-hero">
        <h1>⭐ My Favourite Teams</h1>
        <p>Save your teams and follow their World Cup 2026 journey. Stored on your device — no account needed.</p>
        <div class="fav-hero-meta">
          <span id="teamCountBadge">🌍 48 Qualified Nations</span>
          <span>🏆 FIFA World Cup 2026</span>
          <span>💾 Saved locally</span>
        </div>
      </div>

      <div class="fav-section-hdr">⭐ My Favourites</div>
      <div id="myFavsList"></div>

      <div class="fav-search">
        <input type="text" id="teamSearch" placeholder="Search all 48 teams..." oninput="renderAllTeams()" autocomplete="off">
      </div>

      <div class="conf-filter" id="confFilter"></div>

      <div class="fav-section-hdr">👕 All Teams — tap to add/remove</div>
      <div class="fav-grid" id="allTeamsGrid"></div>

    </div>
  </div>
  <div id="gc-nord-root"></div>
  <div id="gc-footer-root"></div>
</div>

<!-- Single source of truth: worldcup-data.js -->
<script src="/js/worldcup-data.js"></script>
<script src="/js/gc-shared.js"></script>
<script>
/* All team data comes from WC26.teams in worldcup-data.js — no hardcoding */

var activeConf = 'ALL';

/* Build confederation list dynamically from WC26.teams */
function buildConfFilter(){
  var confs = {};
  WC26.teams.forEach(function(t){
    confs[t.conf] = (confs[t.conf]||0) + 1;
  });
  var icons = {UEFA:'🔵',CAF:'🟢',AFC:'🟠',CONCACAF:'🔴',CONMEBOL:'🟡',OFC:'⚪'};
  var html = '<button class="conf-btn active" onclick="setConf(\'ALL\',this)">🌍 All ('+WC26.teams.length+')</button>';
  Object.keys(confs).forEach(function(c){
    html += '<button class="conf-btn" onclick="setConf(\''+c+'\',this)">'+(icons[c]||'🌍')+' '+c+' ('+confs[c]+')</button>';
  });
  document.getElementById('confFilter').innerHTML = html;
  document.getElementById('teamCountBadge').textContent = '🌍 '+WC26.teams.length+' Qualified Nations';
}

function setConf(conf, btn){
  activeConf = conf;
  document.querySelectorAll('.conf-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderAllTeams();
}

function getFavs(){ return JSON.parse(localStorage.getItem('wc26_favourites')||'[]'); }
function saveFavs(f){ localStorage.setItem('wc26_favourites', JSON.stringify(f)); }

function toggleFav(name){
  var favs = getFavs();
  var idx = favs.indexOf(name);
  if(idx > -1) favs.splice(idx,1); else favs.push(name);
  saveFavs(favs);
  renderMyFavs();
  renderAllTeams();
}

function renderMyFavs(){
  var favs = getFavs();
  var el = document.getElementById('myFavsList');
  if(!favs.length){
    el.innerHTML='<div class="fav-empty"><div class="fav-empty-icon">⭐</div><div class="fav-empty-title">No favourites yet</div><div class="fav-empty-sub">Tap any team below to save them to your favourites.</div></div>';
    return;
  }
  var html = '<div class="my-fav-list">';
  favs.forEach(function(name){
    var team = WC26.teams.find(function(t){ return t.name===name; });
    if(!team) return;
    html += '<div class="my-fav-item">'+
      '<div class="my-fav-flag">'+team.flag+'</div>'+
      '<div class="my-fav-info">'+
        '<div class="my-fav-name">'+(team.host?'🏠 ':'')+team.name+' <span style="color:var(--blue);font-size:11px">('+team.code+')</span></div>'+
        '<div class="my-fav-sub">Group '+team.group+' · '+team.conf+(team.host?' · Host Nation':'')+'</div>'+
      '</div>'+
      '<button class="my-fav-remove" onclick="toggleFav(\''+name.replace(/'/g,"\\'")+'\')" >✕ Remove</button>'+
    '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderAllTeams(){
  var query = (document.getElementById('teamSearch').value||'').toLowerCase();
  var favs = getFavs();
  var html = '';
  var count = 0;

  /* Use WC26.teams — single source of truth */
  WC26.teams.forEach(function(team){
    if(activeConf !== 'ALL' && team.conf !== activeConf) return;
    if(query && !team.name.toLowerCase().includes(query) && !(team.code||'').toLowerCase().includes(query)) return;
    var isFav = favs.includes(team.name);
    html += '<div class="team-card'+(isFav?' is-fav':'')+'" onclick="toggleFav(\''+team.name.replace(/'/g,"\\'")+'\')" title="'+(isFav?'Remove from':'Add to')+' favourites">'+
      '<span class="fav-star">⭐</span>'+
      '<div class="team-flag">'+team.flag+'</div>'+
      '<div class="team-code">'+(team.code||'')+'</div>'+
      '<div class="team-name">'+(team.host?'🏠 ':'')+team.name+'</div>'+
      '<div class="team-conf-badge">'+team.conf+'</div>'+
    '</div>';
    count++;
  });

  if(!count){
    html='<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--t3);font-size:13px">No teams found matching "'+query+'"</div>';
  }
  document.getElementById('allTeamsGrid').innerHTML = html;
}

window.onload = function(){
  initWC26Page('favourites', {subtitle:'World Cup 2026 · My Favourites'});
  buildConfFilter();
  renderMyFavs();
  renderAllTeams();
};
</script>
</body>
</html>
