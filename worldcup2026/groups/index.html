<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Groups | GoalCurrent.live</title>
<meta name="description" content="FIFA World Cup 2026 all 12 groups A-L. View standings, teams and fixtures for every group.">
<link rel="canonical" href="https://goalcurrent.live/worldcup2026/groups/">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/worldcup2026.css">
</head>
<body>
<div id="wc-nav"></div>
<main class="wc-container">
<div class="wc-page-header">
<h1>🏆 World Cup 2026 — Groups</h1>
<p>12 Groups · 48 Teams · Top 2 from each group advance</p>
</div>
<div style="padding:20px 0;">
<div class="wc-search-bar">
<span class="wc-search-icon">🔍</span>
<input type="text" id="searchInput" placeholder="Search by team or group..." oninput="filterGroups()">
</div>
</div>
<div class="wc-groups-grid" id="groupsGrid"></div>
</main>
<div id="wc-footer"></div>
<script src="../../js/worldcup-data.js"></script>
<script src="../../js/worldcup-shared.js"></script>
<script>
function filterGroups(){
var query=document.getElementById('searchInput').value.toLowerCase();
var cards=document.querySelectorAll('.wc-group-card');
cards.forEach(function(card){
card.style.display=card.textContent.toLowerCase().includes(query)?'block':'none';
});
}
function renderGroups(){
var grid=document.getElementById('groupsGrid');
var html='';
var groups=WC26.groups;
for(var key in groups){
var group=groups[key];
var rows='';
for(var i=0;i<group.teams.length;i++){
var team=group.teams[i];
rows+='<tr class="'+(i<2?'qualified':'')+'"><td>'+team.flag+' '+team.name+'</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>';
}
html+='<div class="wc-group-card"><h2>GROUP '+key+'</h2><table class="wc-standings"><thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+rows+'</tbody></table><a href="/worldcup2026/groups/group-'+key.toLowerCase()+'/" class="wc-btn wc-btn-primary">View Group '+key+' →</a></div>';
}
grid.innerHTML=html;
}
window.onload=function(){
initWC26Page('groups');
renderGroups();
};
</script>
</body>
</html>
