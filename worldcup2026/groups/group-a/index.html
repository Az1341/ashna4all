<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Group A | GoalCurrent.live</title>
<meta name="description" content="FIFA World Cup 2026 Group A — Mexico, South Africa, Paraguay, Senegal.">
<link rel="canonical" href="https://goalcurrent.live/worldcup2026/groups/group-a/">
<link rel="stylesheet" href="../../../css/worldcup2026.css">
<style>
.match-card{background:var(--wc-card);border:1px solid var(--wc-border);border-radius:var(--wc-radius);padding:16px;margin-bottom:12px;}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:0.75rem;color:var(--wc-muted);}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;}
.match-team{display:flex;flex-direction:column;align-items:center;gap:6px;}
.match-flag{font-size:2rem;}
.match-name{font-size:0.9rem;font-weight:600;color:var(--wc-white);}
.match-center{text-align:center;}
.match-vs{font-size:0.85rem;font-weight:700;color:var(--wc-gold);}
.match-time{font-size:1rem;font-weight:700;color:var(--wc-blue);}
.match-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--wc-border);}
.live-dot{display:inline-flex;align-items:center;gap:5px;background:rgba(239,68,68,0.15);color:#ef4444;font-size:0.75rem;font-weight:700;padding:3px 8px;border-radius:20px;}
.live-dot span{width:8px;height:8px;background:#ef4444;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;}
.stats-btn{background:var(--wc-blue);color:white;border:none;padding:6px 14px;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer;}
.stats-btn:hover{background:var(--wc-gold);color:var(--wc-dark);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--wc-card);border:1px solid var(--wc-border);border-radius:var(--wc-radius);padding:24px;max-width:400px;width:90%;}
.modal h3{color:var(--wc-gold);margin-bottom:16px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--wc-border);font-size:0.85rem;}
.stat-row:last-child{border-bottom:none;}
.modal-close{display:block;margin-top:16px;text-align:center;background:var(--wc-border);color:var(--wc-text);border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.9rem;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
</style>
</head>
<body>
<div id="wc-nav"></div>

<main class="wc-container">
<div class="wc-page-header">
<h1>🏆 Group A</h1>
<p>Mexico · South Africa · Paraguay · Senegal</p>
</div>

<div style="padding:20px 0;">
<div class="wc-section-header">
<h2>Standings</h2>
<a href="/worldcup2026/groups/">← All Groups</a>
</div>
<table class="wc-standings">
<thead>
<tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
</thead>
<tbody id="standingsBody"></tbody>
</table>
</div>

<div style="padding:20px 0;">
<div class="wc-section-header"><h2>Fixtures</h2></div>
<div id="fixturesBody"></div>
</div>

<div style="background:var(--wc-card);border-radius:var(--wc-radius);padding:16px;margin-bottom:24px;">
<h3 style="color:var(--wc-gold);margin-bottom:8px;">Qualification</h3>
<p style="font-size:0.85rem;color:var(--wc-muted);">Top 2 teams advance to Round of 32. Best 8 third-placed teams also advance.</p>
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:48px;">
<a href="/worldcup2026/groups/" class="wc-btn wc-btn-outline">← All Groups</a>
<a href="/worldcup2026/fixtures/" class="wc-btn wc-btn-primary">📅 Fixtures</a>
<a href="/worldcup2026/teams/" class="wc-btn wc-btn-outline">🌍 Teams</a>
</div>
</main>

<div id="wc-footer"></div>

<!-- Stats Modal -->
<div class="modal-overlay" id="statsModal">
<div class="modal">
<h3 id="modalTitle">Match Stats</h3>
<div id="modalContent"></div>
<button class="modal-close" onclick="closeStats()">Close</button>
</div>
</div>

<script src="../../../js/worldcup-data.js"></script>
<script src="../../../js/worldcup-shared.js"></script>
<script>
var GROUP_KEY='A';
var FIXTURES=[
{match:1,home:'Mexico',away:'South Africa',date:'2026-06-11',time:'20:00',venue:'Mexico City'},
{match:2,home:'Paraguay',away:'Senegal',date:'2026-06-12',time:'17:00',venue:'Dallas'},
{match:3,home:'Mexico',away:'Paraguay',date:'2026-06-16',time:'20:00',venue:'Mexico City'},
{match:4,home:'South Africa',away:'Senegal',date:'2026-06-16',time:'17:00',venue:'Atlanta'},
{match:5,home:'Mexico',away:'Senegal',date:'2026-06-20',time:'20:00',venue:'Mexico City'},
{match:6,home:'South Africa',away:'Paraguay',date:'2026-06-20',time:'20:00',venue:'Dallas'}
];

function isLive(date,time){
var now=new Date();
var kick=new Date(date+'T'+time+':00');
var end=new Date(kick.getTime()+110*60000);
return now>=kick&&now<=end;
}

function getFlag(name){
var teams=WC26.groups[GROUP_KEY].teams;
var t=teams.find(function(x){return x.name===name;});
return t?t.flag:'🏳️';
}

function renderStandings(){
var group=WC26.groups[GROUP_KEY];
var html='';
group.teams.forEach(function(team,i){
html+='<tr class="'+(i<2?'qualified':'')+'"><td>'+team.flag+' '+team.name+'</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>';
});
document.getElementById('standingsBody').innerHTML=html;
}

function renderFixtures(){
var html='';
FIXTURES.forEach(function(f){
var live=isLive(f.date,f.time);
html+='<div class="match-card">';
html+='<div class="match-header">';
html+='<span>Group A · Match '+f.match+' · 📍 '+f.venue+'</span>';
html+=live?'<span class="live-dot"><span></span>LIVE</span>':'<span style="color:var(--wc-muted)">'+f.date+'</span>';
html+='</div>';
html+='<div class="match-teams">';
html+='<div class="match-team"><div class="match-flag">'+getFlag(f.home)+'</div><div class="match-name">'+f.home+'</div></div>';
html+='<div class="match-center"><div class="match-vs">VS</div><div class="match-time">'+f.time+' BST</div></div>';
html+='<div class="match-team"><div class="match-flag">'+getFlag(f.away)+'</div><div class="match-name">'+f.away+'</div></div>';
html+='</div>';
html+='<div class="match-footer">';
html+='<span style="font-size:0.8rem;color:var(--wc-muted)">'+f.date+'</span>';
html+='<button class="stats-btn" onclick="showStats(\''+f.home+'\',\''+f.away+'\')">📊 Stats</button>';
html+='</div>';
html+='</div>';
});
document.getElementById('fixturesBody').innerHTML=html;
}

function showStats(home,away){
document.getElementById('modalTitle').textContent=home+' vs '+away;
document.getElementById('modalContent').innerHTML=
'<div class="stat-row"><span>'+home+'</span><span style="color:var(--wc-muted)">Possession</span><span>'+away+'</span></div>'+
'<div class="stat-row"><span>-</span><span style="color:var(--wc-muted)">Shots</span><span>-</span></div>'+
'<div class="stat-row"><span>-</span><span style="color:var(--wc-muted)">Shots on Target</span><span>-</span></div>'+
'<div class="stat-row"><span>-</span><span style="color:var(--wc-muted)">Corners</span><span>-</span></div>'+
'<div class="stat-row"><span>-</span><span style="color:var(--wc-muted)">Fouls</span><span>-</span></div>'+
'<p style="text-align:center;margin-top:12px;font-size:0.75rem;color:var(--wc-muted)">Stats available from 11 June 2026</p>';
document.getElementById('statsModal').classList.add('show');
}

function closeStats(){
document.getElementById('statsModal').classList.remove('show');
}

window.onload=function(){
initWC26Page('groups');
renderStandings();
renderFixtures();
};
</script>
</body>
</html>
