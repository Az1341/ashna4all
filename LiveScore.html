<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scores — World Cup 2026</title>

<!-- Same fonts + styles as index -->
<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

<style>
/* -----------------------------------------------------
   GLOBAL THEME — matches your index.html exactly
----------------------------------------------------- */
body{
  margin:0;
  font-family:Verdana,sans-serif;
  background:var(--bg, #030b1a);
  color:#fff;
  overflow-x:hidden;
}

/* Auto dark/light mode */
body.light-mode{
  background:#f5f5f5;
  color:#111;
}

/* Gold theme */
:root{
  --gold:#c9a84c;
  --gold-light:#f0d080;
}

/* -----------------------------------------------------
   HEADER
----------------------------------------------------- */
header{
  background:rgba(5,10,28,.75);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:14px 20px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:20px;
  font-weight:800;
  color:var(--gold);
}

.back-btn{
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border:1.5px solid var(--gold);
  color:#030712;
  font-size:12px;
  font-weight:800;
  padding:7px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:all .2s;
}
.back-btn:hover{
  transform:scale(1.06);
}

/* -----------------------------------------------------
   MATCH GRID
----------------------------------------------------- */
.match-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:20px;
}
@media(min-width:640px){.match-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.match-grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1280px){.match-grid{grid-template-columns:repeat(4,1fr)}}

/* Match card (same as index) */
.mcard{
  background:rgba(10,18,40,.75);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.mcard:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(201,168,76,.08);
  border-color:#374151;
}

/* Teams */
.mcb{padding:12px 14px;display:flex;align-items:center;gap:8px}
.mt{flex:1;display:flex;flex-direction:column;gap:4px}
.mn{font-size:13px;font-weight:700;color:#fff}

/* Score */
.msw{display:flex;flex-direction:column;align-items:center;gap:4px}
.msn{font-size:28px;font-weight:900;color:var(--gold)}
.msd{font-size:16px;color:#374151}

/* Status badge */
.ms{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px}
.ms-l{background:rgba(239,68,68,.2);color:#f87171}
.ms-f{background:rgba(74,222,128,.1);color:#4ade80}
.ms-u{background:rgba(201,168,76,.1);color:var(--gold)}
.ms-h{background:rgba(251,191,36,.15);color:#fbbf24}

/* TV badges */
.tvb{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.tv-bbc{background:rgba(187,25,25,.2);border:1px solid #bb1919;color:#ff6b6b}
.tv-itv1{background:rgba(255,85,0,.2);border:1px solid #ff5500;color:#ff5500}
.tv-itv{background:rgba(232,119,0,.2);border:1px solid #e87700;color:#e87700}
.tv-both{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold-light)}
.tv-tbc{background:rgba(255,255,255,.05);border:1px solid #374151;color:#6b7280}

/* Section title */
.section-title{
  font-size:20px;
  font-weight:800;
  color:var(--gold);
  padding:20px;
}

/* Empty state */
.empty{
  text-align:center;
  padding:40px 20px;
  color:#6b7280;
  font-size:14px;
}

</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="header-title">⚽ Live Scores</div>
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
  </div>
</header>

<div class="section-title">Live, Recent & Today</div>
<div id="liveContainer" class="match-grid"></div>
<div id="emptyState" class="empty" style="display:none">No matches available right now.</div>

<script>
/* -----------------------------------------------------
   IMPORT MATCHES FROM YOUR INDEX PAGE
----------------------------------------------------- */
var MATCHES = [
  /* Your full 104-match array goes here — unchanged */
];

/* -----------------------------------------------------
   TIMEZONE CONVERSION
----------------------------------------------------- */
function toLocal(utc){
  return new Date(utc);
}

/* -----------------------------------------------------
   DETERMINE STATUS
----------------------------------------------------- */
function getStatus(fix){
  let now = new Date();
  let ko = new Date(fix.utc);
  let end = new Date(ko.getTime() + 120*60000);

  if(now < ko) return {txt:"Upcoming", cls:"ms-u"};
  if(now >= ko && now <= end) return {txt:"Live", cls:"ms-l"};
  return {txt:"Final", cls:"ms-f"};
}

/* -----------------------------------------------------
   TV Badge
----------------------------------------------------- */
function tvBadge(tv){
  if(tv==="BBC") return '<span class="tvb tv-bbc">BBC</span>';
  if(tv==="ITV1") return '<span class="tvb tv-itv1">ITV1</span>';
  if(tv==="ITV") return '<span class="tvb tv-itv">ITV</span>';
  if(tv==="TBC") return '<span class="tvb tv-tbc">TBC</span>';
  return '';
}

/* -----------------------------------------------------
   RENDER MATCH CARD
----------------------------------------------------- */
function card(f){
  let st = getStatus(f);
  let local = toLocal(f.utc);
  let time = local.toLocaleString([], {hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});

  return `
  <div class="mcard">
    <div class="mcb">
      <div class="mt">
        <div class="mn">${f.t1}</div>
      </div>
      <div class="msw">
        <div class="msn">vs</div>
        <div class="msd">${time}</div>
      </div>
      <div class="mt">
        <div class="mn">${f.t2}</div>
      </div>
    </div>
    <div style="padding:0 14px 12px;display:flex;justify-content:space-between;align-items:center">
      <span class="ms ${st.cls}">${st.txt}</span>
      ${tvBadge(f.tv)}
    </div>
  </div>`;
}

/* -----------------------------------------------------
   FILTER: LIVE + RECENT + TODAY
----------------------------------------------------- */
function loadFeed(){
  let now = new Date();
  let today = now.toISOString().slice(0,10);

  let recentCut = new Date(now.getTime() - 24*60*60*1000);

  let feed = MATCHES.filter(f=>{
    let ko = new Date(f.utc);
    let isToday = f.utc.startsWith(today);
    let isRecent = ko >= recentCut && ko <= now;
    let st = getStatus(f).txt === "Live";

    return st || isRecent || isToday;
  });

  if(feed.length===0){
    document.getElementById("emptyState").style.display="block";
  }

  document.getElementById("liveContainer").innerHTML =
    feed.map(card).join("");
}

loadFeed();
setInterval(loadFeed, 30000);
</script>

</body>
</html>
