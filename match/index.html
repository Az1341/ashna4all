<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Details — GoalCurrent.live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 50%, #e0f2fe 100%);
  min-height: 100vh;
  color: #1e293b;
}

/* ── header ── */
.site-header {
  background: linear-gradient(135deg, #001a4d, #002b80, #003fb8);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.site-header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 1.1rem; }
.back-btn {
  color: #93c5fd;
  text-decoration: none;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.back-btn:hover { color: #fff; }

/* ── loading / error ── */
#loading, #error-box {
  text-align: center;
  padding: 60px 20px;
  font-size: 1.1rem;
  color: #64748b;
}
#error-box { color: #dc2626; }

/* ── match header card ── */
.match-header {
  background: linear-gradient(135deg, #001a4d, #002b80);
  color: #fff;
  padding: 16px 20px 20px;
  text-align: center;
}
.match-round {
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #93c5fd;
  margin-bottom: 4px;
}
.match-venue {
  font-size: 0.85rem;
  color: #bfdbfe;
  margin-bottom: 14px;
}

.teams-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: nowrap;
  width: 100%;
}
.team-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-width: 80px;
  flex: 1;
  max-width: 160px;
}
.team-flag {
  width: 48px;
  height: 33px;
  object-fit: cover;
  border-radius: 4px;
  border: 2px solid rgba(255,255,255,0.2);
}
.team-name {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  text-align: center;
}

.score-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 140px;
}
.score-main {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2.2rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 4px;
}
.score-ht {
  font-size: 0.8rem;
  color: #93c5fd;
}
.score-extra {
  font-size: 0.8rem;
  color: #fbbf24;
  font-weight: 600;
}
.score-pen {
  font-size: 0.85rem;
  color: #34d399;
  font-weight: 700;
}

.match-status {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: #1d4ed8;
  background: #fff;
  border-radius: 20px;
  padding: 4px 18px;
  margin-top: 16px;
  display: inline-block;
}
.match-status.live { color: #dc2626; animation: pulse 1.5s infinite; }
.match-status.ft   { color: #16a34a; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.match-time-info {
  font-size: 0.85rem;
  color: #bfdbfe;
  margin-top: 10px;
}
.referee-info {
  font-size: 0.8rem;
  color: #93c5fd;
  margin-top: 6px;
}

/* ── tabs ── */
.tabs-wrapper {
  background: #fff;
  border-bottom: 2px solid #e2e8f0;
  position: sticky;
  top: 0;
  z-index: 10;
  overflow-x: auto;
}
.tabs {
  display: flex;
  gap: 0;
  min-width: max-content;
  padding: 0 16px;
}
.tab-btn {
  padding: 14px 20px;
  border: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover   { color: #1d4ed8; }
.tab-btn.active  { color: #1d4ed8; border-bottom-color: #1d4ed8; }

/* ── content panels ── */
.panel { display: none; max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
.panel.active { display: block; }

/* ── section titles ── */
.section-title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #64748b;
  margin: 24px 0 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid #e2e8f0;
}

/* ── events timeline ── */
.events-list { display: flex; flex-direction: column; gap: 4px; }

.event-row {
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  align-items: center;
  padding: 8px 12px;
  border-radius: 8px;
  background: #f8fafc;
  gap: 8px;
  min-height: 44px;
}
.event-row:hover { background: #f1f5f9; }

.event-home { text-align: right; }
.event-away { text-align: left; }
.event-time-col {
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #1d4ed8;
}
.event-player-name { font-size: 0.9rem; font-weight: 600; color: #1e293b; }
.event-detail      { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
.event-assist      { font-size: 0.75rem; color: #059669; margin-top: 2px; }
.event-icon        { font-size: 1.1rem; }

/* event type colours */
.ev-goal    .event-icon::after { content: '⚽'; }
.ev-owngoal .event-icon::after { content: '⚽'; }
.ev-penalty .event-icon::after { content: '⚽🎯'; }
.ev-missed  .event-icon::after { content: '❌'; }
.ev-yellow  .event-icon::after { content: '🟨'; }
.ev-red     .event-icon::after { content: '🟥'; }
.ev-yr      .event-icon::after { content: '🟨🟥'; }
.ev-sub     .event-icon::after { content: '🔄'; }
.ev-var     .event-icon::after { content: 'VAR'; font-size:0.7rem; font-weight:800; color:#7c3aed; }

.ev-owngoal .event-player-name { color: #dc2626; }
.ev-missed  .event-player-name { color: #dc2626; }

/* ── lineups ── */
.lineups-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media(max-width:600px){ .lineups-grid{ grid-template-columns:1fr; } }

.lineup-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  border: 1px solid #e2e8f0;
}
.lineup-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.lineup-flag {
  width: 32px; height: 22px;
  object-fit: cover;
  border-radius: 3px;
}
.lineup-team-name { font-size: 1rem; font-weight: 700; color: #1e293b; }
.lineup-formation { font-size: 0.8rem; color: #1d4ed8; font-weight: 600; margin-left: auto; }
.lineup-coach     { font-size: 0.8rem; color: #64748b; margin-bottom: 12px; }

.players-group-title {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #94a3b8;
  margin: 10px 0 6px;
}
.player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid #f1f5f9;
}
.player-row:last-child { border-bottom: none; }
.player-number {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #1d4ed8;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.player-number.sub-num { background: #64748b; }
.player-info { flex: 1; }
.player-name { font-size: 0.9rem; font-weight: 600; color: #1e293b; }
.player-pos  { font-size: 0.72rem; color: #64748b; }
.player-pos-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}
.pos-G { background:#fef3c7; color:#b45309; }
.pos-D { background:#dbeafe; color:#1d4ed8; }
.pos-M { background:#dcfce7; color:#16a34a; }
.pos-F { background:#fee2e2; color:#dc2626; }

/* ── pitch visual ── */
.pitch-wrapper {
  background: #166534;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  min-height: 300px;
}
.pitch-lines {
  position: absolute; inset: 0;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  pointer-events: none;
}
.pitch-lines::before {
  content:'';
  position:absolute;
  left:50%; top:0; bottom:0;
  width:2px; background:rgba(255,255,255,0.15);
  transform:translateX(-50%);
}
.pitch-lines::after {
  content:'';
  position:absolute;
  left:50%; top:50%;
  width:80px; height:80px;
  border:2px solid rgba(255,255,255,0.15);
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.pitch-team-label {
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.pitch-rows { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; position: relative; z-index:1; }
.pitch-row  { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.pitch-player {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: default;
}
.pitch-player-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #1d4ed8;
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,0.4);
}
.pitch-player-name {
  font-size: 0.6rem;
  color: #fff;
  text-align: center;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── statistics ── */
.stats-table { width: 100%; border-collapse: collapse; }
.stat-row { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
.stat-row:last-child { border-bottom: none; }
.stat-val-home { text-align: right; font-weight: 700; font-size: 1rem; color: #1e293b; }
.stat-val-away { text-align: left;  font-weight: 700; font-size: 1rem; color: #1e293b; }
.stat-label    { text-align: center; font-size: 0.8rem; color: #64748b; }
.stat-bar-wrapper { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.stat-bar-home { background: #1d4ed8; border-radius: 3px 0 0 3px; }
.stat-bar-away { background: #dc2626; border-radius: 0 3px 3px 0; }

/* ── player stats table ── */
.player-stats-wrapper { overflow-x: auto; }
.player-stats-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  white-space: nowrap;
}
.player-stats-table th {
  background: #f1f5f9;
  padding: 8px 10px;
  text-align: center;
  font-weight: 700;
  color: #475569;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
}
.player-stats-table th:first-child { text-align: left; }
.player-stats-table td {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid #f1f5f9;
  color: #1e293b;
}
.player-stats-table td:first-child { text-align: left; font-weight: 600; }
.player-stats-table tr:hover td { background: #f8fafc; }
.team-header-row td {
  background: #1d4ed8;
  color: #fff;
  font-weight: 700;
  font-size: 0.8rem;
  padding: 6px 10px;
}
.rating-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.78rem;
}
.rating-good   { background: #dcfce7; color: #16a34a; }
.rating-ok     { background: #fef3c7; color: #b45309; }
.rating-poor   { background: #fee2e2; color: #dc2626; }

/* ── no data ── */
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: #94a3b8;
  font-size: 0.9rem;
}
</style>
</head>
<body>

<header class="site-header">
  <a href="/">⚽ GoalCurrent.live</a>
  <a href="/live/" class="back-btn">← Live Scores</a>
</header>

<div id="loading">Loading match data…</div>
<div id="error-box" style="display:none"></div>
<div id="match-content" style="display:none">

  <!-- Match header -->
  <div class="match-header">
    <div class="match-round" id="hd-round"></div>
    <div class="match-venue" id="hd-venue"></div>
    <div class="teams-row">
      <div class="team-block">
        <img class="team-flag" id="hd-home-flag" src="" alt="" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')"><span class="team-flag-fb" id="hd-home-flag-fb" style="display:none;width:48px;height:33px;border-radius:4px;background:#1d4ed8;align-items:center;justify-content:center;font-size:20px">⚽</span>
        <div class="team-name" id="hd-home-name"></div>
      </div>
      <div class="score-block">
        <div class="score-main" id="hd-score"></div>
        <span class="match-status" id="hd-status"></span>
        <div class="score-ht"   id="hd-ht"></div>
        <div class="score-extra" id="hd-et" style="display:none"></div>
        <div class="score-pen"   id="hd-pen" style="display:none"></div>
      </div>
      <div class="team-block">
        <img class="team-flag" id="hd-away-flag" src="" alt="" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')"><span class="team-flag-fb" id="hd-away-flag-fb" style="display:none;width:48px;height:33px;border-radius:4px;background:#1d4ed8;align-items:center;justify-content:center;font-size:20px">⚽</span>
        <div class="team-name" id="hd-away-name"></div>
      </div>
    </div>
    <div class="match-time-info" id="hd-time"></div>
    <div class="referee-info"   id="hd-referee"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs-wrapper">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('events')">⚽ Events</button>
      <button class="tab-btn" onclick="showTab('lineups')">👥 Line-ups</button>
      <button class="tab-btn" onclick="showTab('stats')">📊 Stats</button>
      <button class="tab-btn" onclick="showTab('players')">🏅 Players</button>
    </div>
  </div>

  <!-- Events panel -->
  <div id="panel-events" class="panel active">
    <div class="section-title">Match Events</div>
    <div class="events-list" id="events-list"></div>
    <div class="no-data" id="events-empty" style="display:none">No events recorded yet</div>
  </div>

  <!-- Lineups panel -->
  <div id="panel-lineups" class="panel">
    <div id="pitch-container"></div>
    <div class="lineups-grid" id="lineups-grid"></div>
  </div>

  <!-- Stats panel -->
  <div id="panel-stats" class="panel">
    <div class="section-title">Match Statistics</div>
    <div id="stats-container"></div>
    <div class="no-data" id="stats-empty" style="display:none">Statistics not yet available</div>
  </div>

  <!-- Players panel -->
  <div id="panel-players" class="panel">
    <div class="section-title">Player Statistics</div>
    <div class="player-stats-wrapper">
      <table class="player-stats-table" id="players-table">
        <thead>
          <tr>
            <th>Player</th><th>Pos</th><th>Min</th><th>Rating</th>
            <th>Goals</th><th>Assists</th><th>Shots</th><th>SoT</th>
            <th>Passes</th><th>Acc%</th><th>KeyP</th>
            <th>Tackles</th><th>Inter</th><th>Duels W</th>
            <th>Drib</th><th>Fouls</th><th>YC</th><th>RC</th>
          </tr>
        </thead>
        <tbody id="players-tbody"></tbody>
      </table>
    </div>
    <div class="no-data" id="players-empty" style="display:none">Player statistics not yet available</div>
  </div>

</div>

<script>
// ── flag helper ──
function flagUrl(teamName) {
  const FLAGS = {
    /* Original entries */
    "Mexico":"mx","South Africa":"za","Argentina":"ar","Australia":"au",
    "Brazil":"br","England":"gb-eng","France":"fr","Germany":"de",
    "Italy":"it","Netherlands":"nl","Portugal":"pt","Spain":"es",
    "USA":"us","United States":"us","Canada":"ca","Morocco":"ma","Japan":"jp","South Korea":"kr",
    "Senegal":"sn","Nigeria":"ng","Ecuador":"ec","Uruguay":"uy","Chile":"cl",
    "Colombia":"co","Peru":"pe","Venezuela":"ve","Bolivia":"bo","Paraguay":"py",
    "Costa Rica":"cr","Panama":"pa","Jamaica":"jm","Honduras":"hn",
    "El Salvador":"sv","Trinidad and Tobago":"tt","Cuba":"cu",
    "Saudi Arabia":"sa","Iran":"ir","Iraq":"iq","Qatar":"qa",
    "Korea Republic":"kr","China PR":"cn","Indonesia":"id","Uzbekistan":"uz",
    "New Zealand":"nz","Serbia":"rs","Croatia":"hr","Poland":"pl","Ukraine":"ua",
    "Belgium":"be","Austria":"at","Switzerland":"ch","Sweden":"se",
    "Denmark":"dk","Norway":"no","Czech Republic":"cz","Slovakia":"sk",
    "Hungary":"hu","Romania":"ro","Greece":"gr","Turkey":"tr",
    "Czechia":"cz","Ivory Coast":"ci","Ghana":"gh","Cameroon":"cm",
    "Egypt":"eg","Algeria":"dz","Tunisia":"tn","DR Congo":"cd",
    "Burkina Faso":"bf","Mali":"ml",
    /* WC 2026 teams missing from original map */
    "Curaçao":"cw","Curacao":"cw",
    "Türkiye":"tr",
    "IR Iran":"ir",
    "Scotland":"gb-sct",
    "Bosnia & Herzegovina":"ba","Bosnia & Herz.":"ba","Bosnia and Herzegovina":"ba",
    "Cape Verde":"cv","Cabo Verde":"cv",
    "Côte d'Ivoire":"ci","Cote d'Ivoire":"ci",
    "Haiti":"ht",
    "DR Congo":"cd","Congo DR":"cd",
    "Jordan":"jo",
    "Iceland":"is",
    "Wales":"gb-wls",
    "Northern Ireland":"gb-nir"
  };
  const code = FLAGS[teamName];
  if (code) return `https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/${code}.svg`;
  /* Fallback: neutral flag */
  return `https://raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg`;
}

// ── tab switching ──
function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ── status helpers ──
function statusClass(short) {
  if (['1H','2H','ET','BT','P','LIVE'].includes(short)) return 'live';
  if (['FT','AET','PEN'].includes(short)) return 'ft';
  return '';
}
function statusLabel(status) {
  if (status.short === '1H' || status.short === '2H') return status.elapsed + "'";
  if (status.short === 'HT') return 'HT';
  if (status.short === 'ET') return 'ET ' + status.elapsed + "'";
  if (status.short === 'P')  return 'Penalties';
  if (status.short === 'FT') return 'Full Time';
  if (status.short === 'AET') return 'AET';
  if (status.short === 'PEN') return 'Penalties';
  if (status.short === 'NS') return 'Not Started';
  return status.long;
}

// ── render match header ──
function renderHeader(f) {
  document.title = `${f.home.name} vs ${f.away.name} — GoalCurrent.live`;
  document.getElementById('hd-round').textContent = f.league.round || '';
  document.getElementById('hd-venue').textContent = f.venue ? `${f.venue}, ${f.city}` : '';
  document.getElementById('hd-home-name').textContent = f.home.name;
  document.getElementById('hd-away-name').textContent = f.away.name;
  document.getElementById('hd-home-flag').src = flagUrl(f.home.name);
  document.getElementById('hd-home-flag').alt = f.home.name;
  document.getElementById('hd-away-flag').src = flagUrl(f.away.name);
  document.getElementById('hd-away-flag').alt = f.away.name;

  const gh = f.goals.home ?? '-';
  const ga = f.goals.away ?? '-';
  document.getElementById('hd-score').textContent = `${gh} – ${ga}`;

  const ht = f.score.halftime;
  if (ht.home !== null && ht.away !== null)
    document.getElementById('hd-ht').textContent = `HT: ${ht.home}–${ht.away}`;

  const et = f.score.extratime;
  if (et?.home !== null && et?.away !== null && et?.home !== undefined) {
    const el = document.getElementById('hd-et');
    el.textContent = `Extra Time: ${et.home}–${et.away}`;
    el.style.display = '';
  }
  const pen = f.score.penalty;
  if (pen?.home !== null && pen?.away !== null && pen?.home !== undefined) {
    const pl = document.getElementById('hd-pen');
    pl.textContent = `Penalties: ${pen.home}–${pen.away}`;
    pl.style.display = '';
  }

  const st = document.getElementById('hd-status');
  st.textContent = statusLabel(f.status);
  st.className = 'match-status ' + statusClass(f.status.short);

  const dt = new Date(f.date);
  document.getElementById('hd-time').textContent =
    dt.toLocaleDateString('en-GB', {weekday:'long', year:'numeric', month:'long', day:'numeric'}) +
    ' · ' + dt.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) + ' BST';

  if (f.referee)
    document.getElementById('hd-referee').textContent = `Referee: ${f.referee}`;
}

// ── render events ──
function renderEvents(events, fixture) {
  const list = document.getElementById('events-list');
  if (!events.length) {
    document.getElementById('events-empty').style.display = '';
    return;
  }
  const homeId = fixture.home.id;
  events.forEach(e => {
    const isHome = e.team.id === homeId;
    const typeClass = getEventClass(e.type, e.detail);
    const timeStr = e.extra ? `${e.time}+${e.extra}'` : `${e.time}'`;

    const row = document.createElement('div');
    row.className = `event-row ${typeClass}`;

    const homeHtml = isHome ? `
      <div class="event-home">
        <div class="event-player-name">${e.player.name}</div>
        ${e.detail ? `<div class="event-detail">${e.detail}</div>` : ''}
        ${e.assist ? `<div class="event-assist">↳ ${e.assist}</div>` : ''}
      </div>` : '<div></div>';

    const awayHtml = !isHome ? `
      <div class="event-away">
        <div class="event-player-name">${e.player.name}</div>
        ${e.detail ? `<div class="event-detail">${e.detail}</div>` : ''}
        ${e.assist ? `<div class="event-assist">↳ ${e.assist}</div>` : ''}
      </div>` : '<div></div>';

    row.innerHTML = `
      ${homeHtml}
      <div class="event-time-col">
        <span class="event-icon"></span><br>
        <span style="font-size:0.85rem">${timeStr}</span>
      </div>
      ${awayHtml}`;
    list.appendChild(row);
  });
}

function getEventClass(type, detail) {
  if (type === 'Goal') {
    if (detail === 'Own Goal') return 'ev-owngoal';
    if (detail === 'Penalty') return 'ev-penalty';
    if (detail === 'Missed Penalty') return 'ev-missed';
    return 'ev-goal';
  }
  if (type === 'Card') {
    if (detail === 'Yellow Card') return 'ev-yellow';
    if (detail === 'Red Card')    return 'ev-red';
    if (detail === 'Yellow Red Card') return 'ev-yr';
  }
  if (type === 'subst') return 'ev-sub';
  if (type === 'Var')   return 'ev-var';
  return 'ev-goal';
}

// ── render lineups ──
function renderLineups(lineups) {
  const grid = document.getElementById('lineups-grid');
  const pitchContainer = document.getElementById('pitch-container');

  if (!lineups.length) {
    grid.innerHTML = '<div class="no-data">Line-ups not yet available</div>';
    return;
  }

  // Pitch visual for home team
  if (lineups[0]) {
    pitchContainer.innerHTML = buildPitch(lineups[0], lineups[1]);
  }

  lineups.forEach(l => {
    const card = document.createElement('div');
    card.className = 'lineup-card';
    card.innerHTML = `
      <div class="lineup-header">
        <img class="lineup-flag" src="${flagUrl(l.team.name)}" alt="${l.team.name}">
        <div class="lineup-team-name">${l.team.name}</div>
        <div class="lineup-formation">${l.formation || ''}</div>
      </div>
      <div class="lineup-coach">Coach: ${l.coach?.name || 'Unknown'}</div>
      <div class="players-group-title">Starting XI</div>
      ${l.startXI.map(p => playerRow(p, false)).join('')}
      ${l.substitutes.length ? `<div class="players-group-title">Substitutes</div>${l.substitutes.map(p => playerRow(p, true)).join('')}` : ''}
    `;
    grid.appendChild(card);
  });
}

function playerRow(p, isSub) {
  const pos = p.pos || '?';
  return `
    <div class="player-row">
      <div class="player-number ${isSub ? 'sub-num' : ''}">${p.number || '?'}</div>
      <div class="player-info">
        <div class="player-name">${p.name}</div>
      </div>
      <span class="player-pos-badge pos-${pos}">${pos}</span>
    </div>`;
}

function buildPitch(homeLineup, awayLineup) {
  if (!homeLineup?.formation) return '';
  const rows = homeLineup.formation.split('-').map(Number);
  rows.unshift(1); // GK
  const players = [...homeLineup.startXI];
  let idx = 0;
  const rowsHtml = rows.map(count => {
    const rowPlayers = players.slice(idx, idx + count);
    idx += count;
    return `<div class="pitch-row">${rowPlayers.map(p => `
      <div class="pitch-player">
        <div class="pitch-player-circle">${p.number || '?'}</div>
        <div class="pitch-player-name">${p.name.split(' ').pop()}</div>
      </div>`).join('')}</div>`;
  });

  return `
    <div class="section-title">${homeLineup.team.name} — ${homeLineup.formation}</div>
    <div class="pitch-wrapper">
      <div class="pitch-lines"></div>
      <div class="pitch-team-label">ATTACK</div>
      <div class="pitch-rows">${rowsHtml.reverse().join('')}</div>
      <div class="pitch-team-label">DEFENCE</div>
    </div>`;
}

// ── render stats ──
function renderStats(statistics) {
  const container = document.getElementById('stats-container');
  if (!statistics.length || !statistics[0].data) {
    document.getElementById('stats-empty').style.display = '';
    return;
  }
  const h = statistics[0].data;
  const a = statistics[1]?.data || {};
  const keys = [
    ['ball_possession','Possession','%'],
    ['total_shots','Total Shots',''],
    ['shots_on_goal','Shots on Target',''],
    ['shots_off_goal','Shots off Target',''],
    ['blocked_shots','Blocked Shots',''],
    ['corner_kicks','Corners',''],
    ['fouls','Fouls',''],
    ['offsides','Offsides',''],
    ['yellow_cards','Yellow Cards',''],
    ['red_cards','Red Cards',''],
    ['goalkeeper_saves','GK Saves',''],
    ['total_passes','Total Passes',''],
    ['passes_accurate','Accurate Passes',''],
  ];
  const rows = keys.filter(([k]) => h[k] !== undefined || a[k] !== undefined).map(([k, label, suffix]) => {
    const hv = h[k] ?? 0;
    const av = a[k] ?? 0;
    const hvNum = parseFloat(String(hv).replace('%','')) || 0;
    const avNum = parseFloat(String(av).replace('%','')) || 0;
    const total = hvNum + avNum;
    const hPct = total ? Math.round(hvNum / total * 100) : 50;
    return `
      <div class="stat-row">
        <div class="stat-val-home">
          ${hv}${suffix}
          <div class="stat-bar-wrapper" style="justify-content:flex-end">
            <div class="stat-bar-home" style="width:${hPct}%"></div>
          </div>
        </div>
        <div class="stat-label">${label}</div>
        <div class="stat-val-away">
          ${av}${suffix}
          <div class="stat-bar-wrapper">
            <div class="stat-bar-away" style="width:${100-hPct}%"></div>
          </div>
        </div>
      </div>`;
  });
  container.innerHTML = rows.join('');
}

// ── render players ──
function renderPlayers(players) {
  const tbody = document.getElementById('players-tbody');
  if (!players.length) {
    document.getElementById('players-empty').style.display = '';
    document.getElementById('players-table').style.display = 'none';
    return;
  }
  players.forEach(teamData => {
    // Team header row
    const hdr = document.createElement('tr');
    hdr.className = 'team-header-row';
    hdr.innerHTML = `<td colspan="18">${teamData.team.name}</td>`;
    tbody.appendChild(hdr);

    teamData.players.forEach(p => {
      const r = parseFloat(p.rating);
      const rClass = r >= 7 ? 'rating-good' : r >= 6 ? 'rating-ok' : 'rating-poor';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.name}</td>
        <td><span class="player-pos-badge pos-${p.pos || '?'}">${p.pos || '?'}</span></td>
        <td>${p.minutes ?? '-'}</td>
        <td>${p.rating ? `<span class="rating-badge ${rClass}">${parseFloat(p.rating).toFixed(1)}</span>` : '-'}</td>
        <td>${p.goals?.total ?? '-'}</td>
        <td>${p.goals?.assists ?? '-'}</td>
        <td>${p.shots?.total ?? '-'}</td>
        <td>${p.shots?.on ?? '-'}</td>
        <td>${p.passes?.total ?? '-'}</td>
        <td>${p.passes?.accuracy ?? '-'}</td>
        <td>${p.passes?.key ?? '-'}</td>
        <td>${p.tackles?.total ?? '-'}</td>
        <td>${p.tackles?.interceptions ?? '-'}</td>
        <td>${p.duels?.won ?? '-'}</td>
        <td>${p.dribbles?.success ?? '-'}</td>
        <td>${p.fouls?.committed ?? '-'}</td>
        <td>${p.cards?.yellow ?? '-'}</td>
        <td>${p.cards?.red ?? '-'}</td>`;
      tbody.appendChild(tr);
    });
  });
}

// ── main ──
let refreshTimer = null;

function clearPanels() {
  document.getElementById('events-list').innerHTML = '';
  document.getElementById('events-empty').style.display = 'none';
  document.getElementById('lineups-grid').innerHTML = '';
  document.getElementById('pitch-container').innerHTML = '';
  document.getElementById('stats-empty').style.display = 'none';
  document.getElementById('players-tbody').innerHTML = '';
  document.getElementById('players-empty').style.display = 'none';
  document.getElementById('players-table').style.display = '';
}

async function loadMatch(id, isFirst) {
  try {
    const res  = await fetch(`/api/scores?id=${id}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (!data.fixture && data.matches) {
      throw new Error('Match detail not yet available. The API is returning scheduled data only. Please try again closer to kickoff or during the match.');
    }
    if (!data.fixture) throw new Error('Match data not available');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('match-content').style.display = '';

    clearPanels();
    renderHeader(data.fixture);
    renderEvents(data.events || [], data.fixture);
    renderLineups(data.lineups || []);
    renderStats(data.statistics || []);
    renderPlayers(data.players || []);

    // Refresh in place while live — no page reload, no flash
    const s = data.fixture.status.short;
    const live = ['1H','2H','HT','ET','BT','P'].includes(s);
    if (live && !refreshTimer) {
      refreshTimer = setInterval(() => loadMatch(id, false), 60000);
    }
    if (!live && refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  } catch (err) {
    if (isFirst) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-box').style.display = '';
      document.getElementById('error-box').textContent = `Failed to load match: ${err.message}`;
    } else {
      console.warn('[Match] refresh failed, keeping current data:', err.message);
    }
  }
}

function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = '';
    document.getElementById('error-box').textContent = 'No match ID provided.';
    return;
  }
  loadMatch(id, true);
}

init();
</script>
