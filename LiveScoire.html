<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Football Scores</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    color-scheme: light dark;
    --bg-dark:#0f172a;
    --card-dark:#1e293b;
    --text-dark:#e5e7eb;
    --bg-light:#f9fafb;
    --card-light:#ffffff;
    --text-light:#111827;
    --accent:#22c55e;
  }

  body {
    margin:0;
    font-family:Inter,system-ui;
    background:var(--bg-dark);
    color:var(--text-dark);
    padding:70px 12px 20px;
    transition:0.3s;
  }
  body.light {
    background:var(--bg-light);
    color:var(--text-light);
  }

  header {
    position:fixed;
    top:0; left:0; right:0;
    padding:10px;
    background:rgba(15,23,42,0.95);
    backdrop-filter:blur(10px);
    z-index:1000;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  body.light header {
    background:rgba(249,250,251,0.95);
  }

  .title { font-size:18px; font-weight:700 }

  .tabs { display:flex; gap:6px }
  .tab {
    padding:6px 12px;
    border-radius:999px;
    border:1px solid #64748b;
    background:transparent;
    cursor:pointer;
    font-size:13px;
  }
  .tab.active {
    background:var(--accent);
    border-color:var(--accent);
    color:#0f172a;
    font-weight:600;
  }

  select,input[type="search"] {
    padding:6px 12px;
    border-radius:999px;
    border:1px solid #64748b;
    background:rgba(255,255,255,0.1);
    color:inherit;
    font-size:13px;
  }
  body.light select,body.light input[type="search"] {
    background:rgba(0,0,0,0.05);
  }

  #matches { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:10px }
  .match {
    background:var(--card-dark);
    padding:12px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    cursor:pointer;
    transition:0.15s;
  }
  body.light .match { background:var(--card-light) }
  .match:hover { transform:translateY(-2px) }

  .left { display:flex; gap:10px; align-items:center }
  .league-logo { width:26px; height:26px; border-radius:50%; object-fit:contain }
  .team-logo { width:18px; height:18px; border-radius:50%; object-fit:contain }

  .teams { display:flex; flex-direction:column; gap:2px; font-size:14px }
  .small-muted { opacity:0.7; font-size:11px }

  .right { text-align:right; font-size:13px }
  .status.live { color:#f97316 }
  .status.ft { color:#22c55e }
  .status.ns { color:#94a3b8 }

  #details { max-width:900px; margin:20px auto 0 }
  .detail-panel {
    background:rgba(15,23,42,0.9);
    padding:12px;
    border-radius:10px;
  }
  body.light .detail-panel { background:rgba(255,255,255,0.95) }

  .event-row,.stat-row {
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px dashed #475569;
  }
  .event-row:last-child,.stat-row:last-child { border-bottom:none }
</style>
</head>

<body>

<header>
  <div class="title">Live Scores</div>

  <div class="tabs">
    <button class="tab active" data-range="today">Today</button>
    <button class="tab" data-range="yesterday">Yesterday</button>
    <button class="tab" data-range="tomorrow">Tomorrow</button>
  </div>

  <select id="leagueSelect"><option value="all">All Leagues</option></select>
  <input type="search" id="teamSearch" placeholder="Search team…">
  <button id="themeToggle" class="tab">Dark/Light</button>
</header>

<div id="matches">Loading…</div>
<div id="details"></div>

<script>
// ─────────────────────────────────────────────
// CONFIG (matches your existing API structure)
// ─────────────────────────────────────────────
var BASE='https://v3.football.api-sports.io';
var KEY='YOUR_API_KEY_HERE';   // ← replace locally
var LG=1;                      // World Cup league ID (you can change later)
var SE=2026;                   // World Cup season (change anytime)

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function headers() {
  return { 'x-apisports-key': KEY };
}
function dateOffset(d) {
  const x=new Date(); x.setDate(x.getDate()+d);
  return x.toISOString().slice(0,10);
}
function status(f) {
  const s=f.fixture.status;
  if(s.short==='FT') return {t:'FT',c:'ft'};
  if(s.short==='NS') return {t:new Date(f.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),c:'ns'};
  if(s.short==='HT') return {t:'HT',c:'live'};
  if(s.elapsed) return {t:s.elapsed+"'",c:'live'};
  return {t:s.short,c:'ns'};
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let fixtures=[];
let leagues={};
let currentRange='today';
let selectedLeague='all';
let searchTerm='';
let currentDetail=null;

// ─────────────────────────────────────────────
// UI EVENTS
// ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentRange=btn.dataset.range;
    loadFixtures();
  };
});

document.getElementById('leagueSelect').onchange=e=>{
  selectedLeague=e.target.value;
  renderFixtures();
};

document.getElementById('teamSearch').oninput=e=>{
  searchTerm=e.target.value.toLowerCase();
  renderFixtures();
};

document.getElementById('themeToggle').onclick=()=>{
  document.body.classList.toggle('light');
};

// ─────────────────────────────────────────────
// LOAD FIXTURES
// ─────────────────────────────────────────────
async function loadFixtures() {
  document.getElementById('matches').textContent='Loading…';
  document.getElementById('details').innerHTML='';

  let offset=0;
  if(currentRange==='yesterday') offset=-1;
  if(currentRange==='tomorrow') offset=1;

  const date=dateOffset(offset);

  const url=`${BASE}/fixtures?date=${date}&season=${SE}`;
  const res=await fetch(url,{headers:headers()});
  const json=await res.json();

  fixtures=json.response||[];

  leagues={};
  fixtures.forEach(f=>leagues[f.league.id]=f.league);

  buildLeagueSelect();
  renderFixtures();
}

function buildLeagueSelect() {
  const sel=document.getElementById('leagueSelect');
  const prev=sel.value;
  sel.innerHTML='<option value="all">All Leagues</option>';

  Object.values(leagues)
    .sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(l=>{
      const o=document.createElement('option');
      o.value=l.id;
      o.textContent=l.name;
      sel.appendChild(o);
    });

  sel.value=prev||'all';
  selectedLeague=sel.value;
}

// ─────────────────────────────────────────────
// RENDER FIXTURES
// ─────────────────────────────────────────────
function renderFixtures() {
  const box=document.getElementById('matches');
  box.innerHTML='';

  let list=fixtures;

  if(selectedLeague!=='all')
    list=list.filter(f=>String(f.league.id)===String(selectedLeague));

  if(searchTerm)
    list=list.filter(f=>
      f.teams.home.name.toLowerCase().includes(searchTerm) ||
      f.teams.away.name.toLowerCase().includes(searchTerm)
    );

  if(!list.length) {
    box.textContent='No matches found';
    return;
  }

  list.forEach(f=>{
    const st=status(f);

    const row=document.createElement('div');
    row.className='match';
    row.onclick=()=>openDetails(f.fixture.id);

    row.innerHTML=`
      <div class="left">
        <img class="league-logo" src="${f.league.logo}">
        <div class="teams">
          <span><img class="team-logo" src="${f.teams.home.logo}"> ${f.teams.home.name}</span>
          <span><img class="team-logo" src="${f.teams.away.logo}"> ${f.teams.away.name}</span>
          <span class="small-muted">${f.league.name}</span>
        </div>
      </div>

      <div class="right">
        <div class="status ${st.c}">
          ${f.goals.home??'-'} : ${f.goals.away??'-'} (${st.t})
        </div>
        <div class="small-muted">
          ${new Date(f.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
        </div>
      </div>
    `;

    box.appendChild(row);
  });
}

// ─────────────────────────────────────────────
// MATCH DETAILS
// ─────────────────────────────────────────────
async function openDetails(id) {
  currentDetail=id;
  const box=document.getElementById('details');
  box.innerHTML='<div class="detail-panel">Loading match details…</div>';

  const [evRes,stRes]=await Promise.all([
    fetch(`${BASE}/fixtures/events?fixture=${id}`,{headers:headers()}),
    fetch(`${BASE}/fixtures/statistics?fixture=${id}`,{headers:headers()})
  ]);

  const evJson=await evRes.json();
  const stJson=await stRes.json();

  const events=evJson.response||[];
  const stats=stJson.response||[];

  renderDetails(id,events,stats);
}

function renderDetails(id,events,stats) {
  const fix=fixtures.find(f=>f.fixture.id===id);
  if(!fix) return;

  const box=document.getElementById('details');

  const homeStats=stats.find(s=>s.team.id===fix.teams.home.id);
  const awayStats=stats.find(s=>s.team.id===fix.teams.away.id);

  const evHTML=events.map(e=>`
    <div class="event-row">
      <div>${e.time.elapsed}' ${e.detail||''}</div>
      <div>${e.team.name} – ${e.player?.name||''}</div>
    </div>
  `).join('') || '<div class="small-muted">No events</div>';

  const stHTML=(homeStats&&awayStats)
    ? homeStats.statistics.map((s,i)=>`
        <div class="stat-row">
          <div>${homeStats.statistics[i].value??0} – ${awayStats.statistics[i].value??0}</div>
          <div>${s.type}</div>
        </div>
      `).join('')
    : '<div class="small-muted">No stats</div>';

  box.innerHTML=`
    <div class="detail-panel">
      <div><strong>${fix.teams.home.name}</strong> vs <strong>${fix.teams.away.name}</strong></div>
      <div class="small-muted">${fix.league.name}</div>

      <h4>Events</h4>
      ${evHTML}

      <h4 style="margin-top:10px">Statistics</h4>
      ${stHTML}
    </div>
  `;
}

// ─────────────────────────────────────────────
// AUTO REFRESH
// ─────────────────────────────────────────────
loadFixtures();
setInterval(loadFixtures,60000);
</script>

</body>
</html>
